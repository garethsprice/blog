title: Res·cog
tagline: "Notes on building thinking things"
description: >-
  Thoughts on AI, engineering leadership, and building technology teams
  from a startup CTO with an AI degree, ex-NYT, and 2021 Pulitzer Prize contributor.
url: "http://garethsprice.github.io"
baseurl: "/blog"
markdown: kramdown
permalink: /:title/
excerpt_separator: "<!--more-->"
exclude:
  - _drafts
  - Makefile
  - README.md
max_revisions_count: 5
google_analytics_id: G-H4W90T5EWY

collections:
  docs:
    output: true
    permalink: /docs/:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - liquid_reading_time

author:
  name: Gareth Price
  title: "CTO"
  company: "CorralData"
  company_url: https://www.corraldata.com
  email: gareth.s.price@gmail.com
  linkedin: https://www.linkedin.com/in/garethsprice
  github: https://www.github.com/garethsprice
  github_repo: https://www.github.com/garethsprice/blog
  bio: >-
    CTO with an AI degree from the University of Manchester, 14+ years
    hands-on engineering and 6+ years leadership experience. Currently
    building AI tools at CorralData. Previously led teams at The New York
    Times contributing to the 2021 Pulitzer Prize and +$500MM ARR growth.
  location: "New York, NY"

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
      author: Gareth Price
  - scope:
      path: ""
      type: "docs"
    values:
      layout: page
