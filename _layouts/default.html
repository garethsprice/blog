<!doctype html>
<html lang="en">
  <head>
    {% include head.html %}
  </head>
  <body>
    {% include nav.html %}
    {% if page.url == '/' or page.url == '/about/' %}
    <aside class="avatar">
      <img src="{{ '/assets/img/dog-avatar.jpg' | relative_url }}" alt="CCTV still frame of the author on all fours in a garden, with a computer vision bounding box labelling him as 'dog: 75% confidence'" width="100" height="100">
      <p>The author, as seen by his machines.</p>
    </aside>
    {% endif %}
    {% include header.html %}
    <main>
      {{ content | typogrify }}
    </main>
    {% include footer.html %}
  </body>
</html>
