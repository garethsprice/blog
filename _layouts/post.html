---
layout: default
---

<div class="post-container">
  <article class="post">
    <header class="post-header">
      <h2>{{ page.title | escape }}</h2>
    </header>
    {{ content }}
    <footer class="post-footer">
      <p>Written by <strong>{{ site.author.name }}</strong> — {{ site.author.title }}.</p>
      <p><a href="{{ '/' | relative_url }}">Back to all posts</a></p>
    </footer>
  </article>
</div>
