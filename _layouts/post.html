---
layout: default
---

<article class="post">
  <header class="post-header">
    <h2>{{ page.title | escape }}</h2>
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
  </header>
  {{ content }}
  <footer class="post-footer">
    <p>Written by <strong>{{ site.author.name }}</strong> — {{ site.author.title }}.</p>
    <p><a href="{{ '/' | relative_url }}">Back to all posts</a></p>
  </footer>
</article>
