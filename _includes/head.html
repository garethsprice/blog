<meta charset="utf-8">
<script>
var t = localStorage.getItem('theme');
if (t) document.documentElement.style.colorScheme = t;
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>{% if page.title and page.title != "Home" %}{{ page.title | escape }} – {{ site.author.name }}, {{ site.author.title }} @ {{ site.author.company }} - {{ site.title | escape }}{% else %}{{ site.title | escape }} – {{ site.tagline | escape }}{% endif %}</title>
<meta name="author" content="{{ site.author.name }}">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" media="screen" href="https://fontlibrary.org/face/cmu-serif" type="text/css"/>
<link rel="canonical" href="{{ page.url | absolute_url }}">
{% feed_meta %}
{% seo %}
{% include google-analytics.html %}
